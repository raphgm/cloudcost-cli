version: "1"

pipeline:
  name: idle-acr-geo-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: acr_replicas
    type: azure.idle_acr_geo_replication
    config:
      resource_group: cost-compare-3day-rg

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-acr-geo-real.duckdb

loads:
  - input: acr_replicas
    destination: local_duckdb
    table: fact_idle_acr_geo_replication
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-acr-geo-replication
    type: sql
    query_file: policies/idle_acr_geo_replication.sql
    severity: medium
