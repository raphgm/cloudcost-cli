version: "1"

pipeline:
  name: idle-acr-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: idle_acrs
    type: azure.idle_container_registries
    config:
      resource_group: cost-compare-3day-rg

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-acr-real.duckdb

loads:
  - input: idle_acrs
    destination: local_duckdb
    table: fact_idle_container_registries
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-container-registries
    type: sql
    query_file: policies/idle_container_registries.sql
    severity: medium
