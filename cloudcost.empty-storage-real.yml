version: "1"

pipeline:
  name: empty-storage-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: empty_storage
    type: azure.empty_storage_accounts
    config:
      resource_group: cost-compare-3day-rg

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/empty-storage-real.duckdb

loads:
  - input: empty_storage
    destination: local_duckdb
    table: fact_empty_storage_accounts
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: empty-storage-accounts
    type: sql
    query_file: policies/empty_storage_accounts.sql
    severity: low
