version: "1"

pipeline:
  name: orphaned-nsg-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: orphaned_nsgs
    type: azure.orphaned_nsgs
    config:
      resource_group: cost-compare-3day-rg

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/orphaned-nsg-real.duckdb

loads:
  - input: orphaned_nsgs
    destination: local_duckdb
    table: fact_orphaned_nsgs
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: orphaned-nsgs
    type: sql
    query_file: policies/orphaned_nsgs.sql
    severity: low
