version: "1"

pipeline:
  name: sql-dtu-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: dtu_metrics
    type: azure.sql_dtu_metrics
    config:
      resource_group: cost-compare-3day-rg
      lookback_days: 1

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/sql-dtu-real.duckdb

loads:
  - input: dtu_metrics
    destination: local_duckdb
    table: fact_sql_dtu_metrics
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: sql-dtu-underutilized
    type: sql
    query_file: policies/sql_dtu_underutilized.sql
    severity: low
