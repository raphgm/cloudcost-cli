version: "1"

pipeline:
  name: idle-lb-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: idle_lbs
    type: azure.idle_load_balancers
    config:
      resource_group: cost-compare-3day-rg

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-lb-real.duckdb

loads:
  - input: idle_lbs
    destination: local_duckdb
    table: fact_idle_load_balancers
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-load-balancers
    type: sql
    query_file: policies/idle_load_balancers.sql
    severity: medium
