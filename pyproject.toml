[project]
name = "cloudcost-finops"
version = "0.2.0"
description = "Azure-first FinOps waste detection CLI for cloud cost governance"
readme = "README.md"
authors = [
    { name = "Raphael", email = "rdgabmomoh@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "adbc-driver-postgresql>=1.12.0",
    "azure-identity>=1.25.3",
    "azure-storage-blob>=12.30.2",
    "boto3>=1.43.98",
    "duckdb>=1.5.5",
    "google-cloud-bigquery>=3.45.2",
    "oci>=2.186.0",
    "oss2>=2.19.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "requests>=2.32.0",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.27.2",
]

[project.urls]
Homepage = "https://github.com/raphgm/cloudcost-cli"
Repository = "https://github.com/raphgm/cloudcost-cli"
Issues = "https://github.com/raphgm/cloudcost-cli/issues"

[project.scripts]
cloudcost = "cloudcost.cli:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "cloudcost"
