version: "1"

pipeline:
  name: idle-natgw-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: idle_natgws
    type: azure.idle_nat_gateways
    config:
      resource_group: cost-compare-3day-rg

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-natgw-real.duckdb

loads:
  - input: idle_natgws
    destination: local_duckdb
    table: fact_idle_nat_gateways
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-nat-gateways
    type: sql
    query_file: policies/idle_nat_gateways.sql
    severity: medium
