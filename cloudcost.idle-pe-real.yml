version: "1"

pipeline:
  name: idle-pe-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: pe_metrics
    type: azure.idle_private_endpoints
    config:
      resource_group: cost-compare-3day-rg
      lookback_days: 1

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-pe-real.duckdb

loads:
  - input: pe_metrics
    destination: local_duckdb
    table: fact_idle_private_endpoints
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-private-endpoints
    type: sql
    query_file: policies/idle_private_endpoints.sql
    severity: low
