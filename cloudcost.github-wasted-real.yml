version: "1"

pipeline:
  name: github-wasted-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: gh_runs
    type: github.wasted_actions_minutes
    config:
      owner: raphgm
      repo: webupgrade
      lookback_days: 30

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/github-wasted-real.duckdb

loads:
  - input: gh_runs
    destination: local_duckdb
    table: fact_github_wasted_actions
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: github-wasted-actions-minutes
    type: sql
    query_file: policies/github_wasted_actions_minutes.sql
    severity: low
