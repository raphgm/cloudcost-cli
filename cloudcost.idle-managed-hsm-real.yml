version: "1"

pipeline:
  name: idle-managed-hsm-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: hsm_metrics
    type: azure.idle_managed_hsm
    config:
      resource_group: cost-compare-3day-rg
      lookback_days: 1

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-managed-hsm-real.duckdb

loads:
  - input: hsm_metrics
    destination: local_duckdb
    table: fact_idle_managed_hsm
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-managed-hsm
    type: sql
    query_file: policies/idle_managed_hsm.sql
    severity: high
