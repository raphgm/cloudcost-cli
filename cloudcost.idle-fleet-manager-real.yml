version: "1"

pipeline:
  name: idle-fleet-manager-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: fleet_hub
    type: azure.idle_fleet_manager
    config:
      resource_group: cost-compare-3day-rg

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-fleet-manager-real.duckdb

loads:
  - input: fleet_hub
    destination: local_duckdb
    table: fact_idle_fleet_manager
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-fleet-manager
    type: sql
    query_file: policies/idle_fleet_manager.sql
    severity: medium
