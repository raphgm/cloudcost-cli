version: "1"

pipeline:
  name: idle-cae-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: cae_profiles
    type: azure.idle_container_apps_dedicated
    config:
      resource_group: cost-compare-3day-rg

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-cae-real.duckdb

loads:
  - input: cae_profiles
    destination: local_duckdb
    table: fact_idle_container_apps_dedicated
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-container-apps-dedicated
    type: sql
    query_file: policies/idle_container_apps_dedicated.sql
    severity: medium
