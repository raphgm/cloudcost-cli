version: "1"

pipeline:
  name: idle-openai-ptu-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: openai_ptu
    type: azure.idle_openai_ptu
    config:
      resource_group: cost-compare-3day-rg
      lookback_days: 1

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-openai-ptu-real.duckdb

loads:
  - input: openai_ptu
    destination: local_duckdb
    table: fact_idle_openai_ptu
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-openai-ptu
    type: sql
    query_file: policies/idle_openai_ptu.sql
    severity: high
