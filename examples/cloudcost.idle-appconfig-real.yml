version: "1"

pipeline:
  name: idle-appconfig-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: appconfig_metrics
    type: azure.idle_app_configuration
    config:
      resource_group: cost-compare-3day-rg
      lookback_days: 1

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-appconfig-real.duckdb

loads:
  - input: appconfig_metrics
    destination: local_duckdb
    table: fact_idle_app_configuration
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-app-configuration
    type: sql
    query_file: policies/idle_app_configuration.sql
    severity: low
