version: "1"

pipeline:
  name: idle-tm-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: tm_metrics
    type: azure.idle_traffic_manager
    config:
      resource_group: cost-compare-3day-rg
      lookback_days: 1

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-tm-real.duckdb

loads:
  - input: tm_metrics
    destination: local_duckdb
    table: fact_idle_traffic_manager
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-traffic-manager
    type: sql
    query_file: policies/idle_traffic_manager.sql
    severity: low
