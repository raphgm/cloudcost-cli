version: "1"

pipeline:
  name: idle-signalr-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: signalr_metrics
    type: azure.idle_signalr
    config:
      resource_group: cost-compare-3day-rg
      lookback_days: 1

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-signalr-real.duckdb

loads:
  - input: signalr_metrics
    destination: local_duckdb
    table: fact_idle_signalr
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-signalr
    type: sql
    query_file: policies/idle_signalr.sql
    severity: medium
