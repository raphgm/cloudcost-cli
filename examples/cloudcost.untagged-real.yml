version: "1"

pipeline:
  name: untagged-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: untagged
    type: azure.untagged_resources
    config:
      resource_group: cost-compare-3day-rg

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/untagged-real.duckdb

loads:
  - input: untagged
    destination: local_duckdb
    table: fact_untagged_resources
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: untagged-resources
    type: sql
    query_file: policies/untagged_resources.sql
    severity: low
