version: "1"

pipeline:
  name: idle-appgw-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: idle_appgws
    type: azure.idle_app_gateways
    config:
      resource_group: cost-compare-3day-rg

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-appgw-real.duckdb

loads:
  - input: idle_appgws
    destination: local_duckdb
    table: fact_idle_app_gateways
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-app-gateways
    type: sql
    query_file: policies/idle_app_gateways.sql
    severity: medium
