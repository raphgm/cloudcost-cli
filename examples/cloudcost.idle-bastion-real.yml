version: "1"

pipeline:
  name: idle-bastion-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: bastion_metrics
    type: azure.idle_bastion
    config:
      resource_group: cost-compare-3day-rg
      lookback_days: 1

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-bastion-real.duckdb

loads:
  - input: bastion_metrics
    destination: local_duckdb
    table: fact_idle_bastion
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-bastion
    type: sql
    query_file: policies/idle_bastion.sql
    severity: medium
