version: "1"

pipeline:
  name: idle-pip-prefix-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: pip_prefixes
    type: azure.idle_public_ip_prefix
    config:
      resource_group: cost-compare-3day-rg

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-pip-prefix-real.duckdb

loads:
  - input: pip_prefixes
    destination: local_duckdb
    table: fact_idle_public_ip_prefix
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-public-ip-prefix
    type: sql
    query_file: policies/idle_public_ip_prefix.sql
    severity: medium
