version: "1"

pipeline:
  name: idle-ai-search-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: ai_search_metrics
    type: azure.idle_ai_search
    config:
      resource_group: cost-compare-3day-rg
      lookback_days: 1

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-ai-search-real.duckdb

loads:
  - input: ai_search_metrics
    destination: local_duckdb
    table: fact_idle_ai_search
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-ai-search
    type: sql
    query_file: policies/idle_ai_search.sql
    severity: medium
