version: "1"

pipeline:
  name: idle-swa-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: swa_metrics
    type: azure.idle_static_web_app
    config:
      resource_group: cost-compare-3day-rg
      lookback_days: 1

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-swa-real.duckdb

loads:
  - input: swa_metrics
    destination: local_duckdb
    table: fact_idle_static_web_app
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-static-web-app
    type: sql
    query_file: policies/idle_static_web_app.sql
    severity: low
