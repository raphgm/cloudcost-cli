version: "1"

pipeline:
  name: idle-asp-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: idle_plans
    type: azure.idle_app_service_plans
    config:
      resource_group: cost-compare-3day-rg

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-asp-real.duckdb

loads:
  - input: idle_plans
    destination: local_duckdb
    table: fact_idle_app_service_plans
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-app-service-plans
    type: sql
    query_file: policies/idle_app_service_plans.sql
    severity: medium
