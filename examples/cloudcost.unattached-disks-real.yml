version: "1"

pipeline:
  name: unattached-disks-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: disks
    type: azure.unattached_disks
    config:
      resource_group: rightsizing-test-rg

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/unattached-disks-real.duckdb

loads:
  - input: disks
    destination: local_duckdb
    table: fact_unattached_disks
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: unattached-disks
    type: sql
    query_file: policies/unattached_disks.sql
    severity: medium
