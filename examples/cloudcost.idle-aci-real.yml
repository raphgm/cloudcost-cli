version: "1"

pipeline:
  name: idle-aci-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: aci_metrics
    type: azure.idle_container_instances
    config:
      resource_group: cost-compare-3day-rg
      lookback_days: 1

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-aci-real.duckdb

loads:
  - input: aci_metrics
    destination: local_duckdb
    table: fact_idle_container_instances
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-container-instances
    type: sql
    query_file: policies/idle_container_instances.sql
    severity: medium
