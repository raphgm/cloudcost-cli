version: "1"

pipeline:
  name: idle-grafana-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: grafana_metrics
    type: azure.idle_managed_grafana
    config:
      resource_group: cost-compare-3day-rg
      lookback_days: 1

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-grafana-real.duckdb

loads:
  - input: grafana_metrics
    destination: local_duckdb
    table: fact_idle_managed_grafana
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-managed-grafana
    type: sql
    query_file: policies/idle_managed_grafana.sql
    severity: low
