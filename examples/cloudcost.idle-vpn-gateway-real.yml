version: "1"

pipeline:
  name: idle-vpn-gateway-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: vpn_gateway_metrics
    type: azure.idle_vpn_gateway
    config:
      resource_group: cost-compare-3day-rg
      lookback_days: 1

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-vpn-gateway-real.duckdb

loads:
  - input: vpn_gateway_metrics
    destination: local_duckdb
    table: fact_idle_vpn_gateway
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-vpn-gateway
    type: sql
    query_file: policies/idle_vpn_gateway.sql
    severity: medium
