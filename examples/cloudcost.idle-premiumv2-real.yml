version: "1"

pipeline:
  name: idle-premiumv2-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: premiumv2_disks
    type: azure.idle_premiumv2_disk_overage
    config:
      resource_group: cost-compare-3day-rg

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-premiumv2-real.duckdb

loads:
  - input: premiumv2_disks
    destination: local_duckdb
    table: fact_idle_premiumv2_disk_overage
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-premiumv2-disk-overage
    type: sql
    query_file: policies/idle_premiumv2_disk_overage.sql
    severity: low
