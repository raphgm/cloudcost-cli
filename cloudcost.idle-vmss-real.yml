version: "1"

pipeline:
  name: idle-vmss-real-test
  mode: incremental
  timezone: UTC

sources:
  - name: vmss_metrics
    type: azure.idle_vmss
    config:
      resource_group: cost-compare-3day-rg
      lookback_days: 1

destinations:
  - name: local_duckdb
    type: duckdb
    config:
      path: ./data/idle-vmss-real.duckdb

loads:
  - input: vmss_metrics
    destination: local_duckdb
    table: fact_idle_vmss
    mode: overwrite

observability:
  log_level: info
  emit_run_summary: true

policies:
  - name: idle-vmss
    type: sql
    query_file: policies/idle_vmss.sql
    severity: medium
